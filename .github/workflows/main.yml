name: Compilar APK de Python

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Buildozer y Dependencias del Sistema
      run: |
        pip install --upgrade pip
        pip install virtualenv
        pip install "cython<3.0"
        pip install buildozer
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev autoconf automake libtool pkg-config patch unzip zip zlib1g-dev
        sudo apt-get install -y libsqlite3-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev

    - name: Configurar archivo buildozer.spec de manera blindada
      run: |
        buildozer init
        # Configuraciones Generales
        sed -i 's/.*title =.*/title = Gato Llaves/g' buildozer.spec
        sed -i 's/.*package.name =.*/package.name = gatollaves/g' buildozer.spec
        sed -i 's/.*requirements =.*/requirements = python3,pygame/g' buildozer.spec
        sed -i 's/.*orientation =.*/orientation = portrait/g' buildozer.spec
        
        # Configuraciones Críticas de Android para evitar fallos del NDK con Pygame
        sed -i 's/.*android.accept_sdk_license.*/android.accept_sdk_license = True/g' buildozer.spec
        sed -i 's/.*android.api =.*/android.api = 33/g' buildozer.spec
        sed -i 's/.*android.minapi =.*/android.minapi = 21/g' buildozer.spec
        sed -i 's/.*android.ndk =.*/android.ndk = 25b/g' buildozer.spec
        sed -i 's/.*android.archs =.*/android.archs = arm64-v8a/g' buildozer.spec

    - name: Compilar APK con Buildozer y Diagnóstico de Errores
      run: |
        # Variables de entorno esenciales para servidores en la nube ejecutados como root
        export BUILDOZER_WARN_ON_ROOT=0
        export BUILDOZER_ALLOW_KIVY_NEW_DESIGN=1
        
        # Ejecución y volcado de errores específicos si falla
        if ! yes | buildozer -v android debug; then
          echo "========================================================"
          echo "           LA COMPILACIÓN FALLÓ - MOSTRANDO LOGS         "
          echo "========================================================"
          if [ -f ~/.buildozer/android/platform/build-arm64-v8a/dists/gatollaves__arm64-v8a/build.log ]; then
            tail -n 150 ~/.buildozer/android/platform/build-arm64-v8a/dists/gatollaves__arm64-v8a/build.log
          elif [ -f ~/.buildozer/build.log ]; then
            tail -n 150 ~/.buildozer/build.log
          else
            echo "No se encontró el archivo de log en la ruta estándar. Buscando archivos .log..."
            find ~/ -name "*.log" -exec tail -n 50 {} \;
          fi
          exit 1
        fi

    - name: Subir el APK finalizado
      uses: actions/upload-artifact@v4
      with:
        name: JuegoGatoLlaves-APK
        path: bin/*.apk
