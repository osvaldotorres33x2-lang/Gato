name: Compilar APK de Python

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Buildozer y Herramientas de Compilación
      run: |
        pip install --upgrade pip
        pip install virtualenv
        # Forzar Cython menor a 3.0 es crucial para que compilen las recetas de Pygame en Android
        pip install buildozer "cython<3.0"  
        sudo apt-get update
        # Instalar TODAS las herramientas de compilación de bajo nivel necesarias para compilar C/C++ en Android
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev autoconf automake libtool pkg-config patch unzip zip zlib1g-dev
        sudo apt-get install -y libsqlite3-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev

    - name: Crear y Configurar buildozer.spec de forma Segura
      run: |
        buildozer init
        # Reemplazos ultra-seguros usando expresiones regulares para evitar fallos de sintaxis
        sed -i 's/.*title =.*/title = Gato Llaves/g' buildozer.spec
        sed -i 's/.*package.name =.*/package.name = gatollaves/g' buildozer.spec
        sed -i 's/.*requirements =.*/requirements = python3,pygame/g' buildozer.spec
        sed -i 's/.*orientation =.*/orientation = portrait/g' buildozer.spec
        # FORZAR la aceptación de las licencias del SDK de Android para que la consola no se quede esperando confirmación
        sed -i 's/.*android.accept_sdk_license.*/android.accept_sdk_license = True/g' buildozer.spec

    - name: Compilar APK con Buildozer
      run: |
        # Usamos export para evitar advertencias de ejecución como root si llegase a ocurrir
        export BUILDOZER_ALLOW_KIVY_NEW_DESIGN=1
        yes | buildozer -v android debug

    - name: Subir el APK finalizado
      uses: actions/upload-artifact@v4
      with:
        name: JuegoGatoLlaves-APK
        path: bin/*.apk
